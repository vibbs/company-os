<svg xmlns="http://www.w3.org/2000/svg" id="cos-artifact-lineage" width="960" height="1024" viewBox="0 0 960 1024" role="img" aria-labelledby="cos-artifact-lineage-title cos-artifact-lineage-desc">
<title id="cos-artifact-lineage-title">Artifacts: lineage, status, and enforcement</title>
<desc id="cos-artifact-lineage-desc">Every artifact moves draft, review, approved, and can be archived from any state; promote.sh enforces the order. Lineage example: ICP is parent of PRD; PRD is parent of RFC and launch brief; RFC is parent of security review, test plan, test data, and QA report; QA report depends on test plan. Frontmatter requires id, type, title, status, created, author; optional parent, children, depends_on, blocks. Enforcement chain: validate.sh, link.sh, promote.sh, check-gate.sh. Claude Code hooks: session-start.sh, pre-promote-validate.sh, post-write-artifact-check.sh. Types: prd, rfc, test-plan, qa-report, launch-brief, security-review, decision-memo, test-data, icp, market-intelligence, research, sprint-plan, feedback-report, experiment, diagram, loi.</desc>
