<svg xmlns="http://www.w3.org/2000/svg" id="cos-install-upgrade" width="960" height="948" viewBox="0 0 960 948" role="img" aria-labelledby="cos-install-upgrade-title cos-install-upgrade-desc">
<title id="cos-install-upgrade-title">Install once, upgrade safely</title>
<desc id="cos-install-upgrade-desc">Install: run the installer with curl; it auto-detects Claude Code, Cursor, Codex, Gemini CLI and Aider or takes --runtime; installs os/ and AGENTS.md always plus one adapter per runtime; never overwrites company.config.yaml, artifacts, tasks, cogs or agent memory; then run /setup and start with /ship, /gtm-sprint or /rapid-prototype. Upgrade: /upgrade-company-os check, preview (dry run), apply (backs up first on major versions), smart merge using manifest hashes (untouched files update, edited files are kept, files changed on both sides become conflicts), migrations and health check, rollback from a backup.</desc>
<style>
#cos-install-upgrade{--bg:#f6f8fa;--surface:#ffffff;--sunken:#f6f8fa;--border:#d1d9e0;--border-soft:#e4e9ee;--text:#1f2328;--text-2:#4b5562;--text-3:#606a76;--line:#8c959f;--shadow:#1f2328;--shadow-o:0.07;--solid:#24292f;--on-solid:#ffffff;--mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
#cos-install-upgrade .f-orch{--a:#4f46e5;--a-soft:#eef0ff}#cos-install-upgrade .f-product{--a:#7c3aed;--a-soft:#f4effe}#cos-install-upgrade .f-eng{--a:#0f766e;--a-soft:#e6f5f3}#cos-install-upgrade .f-qa{--a:#0369a1;--a-soft:#e8f4fb}#cos-install-upgrade .f-growth{--a:#be185d;--a-soft:#fdf0f6}#cos-install-upgrade .f-ops{--a:#b42318;--a-soft:#fdf1f0}#cos-install-upgrade .f-gate{--a:#b45309;--a-soft:#fef6e7}#cos-install-upgrade .f-neutral{--a:#4b5562;--a-soft:#f1f3f5}
@media (prefers-color-scheme: dark){#cos-install-upgrade{--bg:#0d1117;--surface:#151b23;--sunken:#10151c;--border:#3d444d;--border-soft:#2a3038;--text:#e6edf3;--text-2:#b1bac4;--text-3:#9198a1;--line:#7d8590;--shadow:#000000;--shadow-o:0.35;--solid:#e6edf3;--on-solid:#0d1117}#cos-install-upgrade .f-orch{--a:#a5b4fc;--a-soft:rgba(129,140,248,0.16)}#cos-install-upgrade .f-product{--a:#c4b5fd;--a-soft:rgba(167,139,250,0.16)}#cos-install-upgrade .f-eng{--a:#5eead4;--a-soft:rgba(45,212,191,0.14)}#cos-install-upgrade .f-qa{--a:#7dd3fc;--a-soft:rgba(56,189,248,0.14)}#cos-install-upgrade .f-growth{--a:#f9a8d4;--a-soft:rgba(244,114,182,0.14)}#cos-install-upgrade .f-ops{--a:#fca5a5;--a-soft:rgba(248,113,113,0.14)}#cos-install-upgrade .f-gate{--a:#fbbf24;--a-soft:rgba(251,191,36,0.14)}#cos-install-upgrade .f-neutral{--a:#b1bac4;--a-soft:rgba(177,186,196,0.12)}}
