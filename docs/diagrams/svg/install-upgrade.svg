#cos-install-upgrade .r-title{font-size:22px;font-weight:600}#cos-install-upgrade .r-sub{font-size:14px;font-weight:400}#cos-install-upgrade .r-h{font-size:14px;font-weight:600}#cos-install-upgrade .r-hs{font-size:13px;font-weight:600}#cos-install-upgrade .r-body{font-size:13px;font-weight:400}#cos-install-upgrade .r-meta{font-size:12px;font-weight:400}#cos-install-upgrade .r-badge{font-size:12px;font-weight:500}#cos-install-upgrade .r-label{font-size:12px;font-weight:600;letter-spacing:0.04em}#cos-install-upgrade .r-code{font-size:12px;font-weight:400;font-family:var(--mono)}#cos-install-upgrade .r-codeh{font-size:13px;font-weight:600;font-family:var(--mono)}
#cos-install-upgrade .r-sub,#cos-install-upgrade .r-body{fill:var(--text-2)}
#cos-install-upgrade .r-meta{fill:var(--text-3)}
