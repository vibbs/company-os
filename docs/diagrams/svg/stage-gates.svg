<svg xmlns="http://www.w3.org/2000/svg" id="cos-stage-gates" width="960" height="784" viewBox="0 0 960 784" role="img" aria-labelledby="cos-stage-gates-title cos-stage-gates-desc">
<title id="cos-stage-gates-title">Which gates block, by company stage</title>
<desc id="cos-stage-gates-desc">Matrix of four gates by four stages. idea: all gates advisory. mvp: prd-to-rfc and rfc-to-impl enforced, impl-to-qa and release advisory. growth and scale: all enforced. The AI safety check inside the release gate follows the same pattern as release. Advisory prints warnings and exits 0. Enforced prints failures and exits 1. No stage set means growth; an unknown stage is enforced.</desc>
