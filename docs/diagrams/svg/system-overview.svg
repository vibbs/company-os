<svg xmlns="http://www.w3.org/2000/svg" id="cos-system-overview" width="960" height="872" viewBox="0 0 960 872" role="img" aria-labelledby="cos-system-overview-title cos-system-overview-desc">
<title id="cos-system-overview-title">How Company OS fits into your repo</title>
<desc id="cos-system-overview-desc">Company OS overlays your repo. You run a command; 9 agents decide what happens, 64 skills say how to think and what to produce, and 33 tool scripts execute fixed actions. All layers read and write artifacts: Markdown files with YAML frontmatter and lineage links. Skills and agents are authored in os/ and built into runtime adapters.</desc>
