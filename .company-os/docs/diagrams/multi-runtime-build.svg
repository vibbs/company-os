<svg xmlns="http://www.w3.org/2000/svg" id="cos-multi-runtime-build" width="960" height="848" viewBox="0 0 960 848" role="img" aria-labelledby="cos-multi-runtime-build-title cos-multi-runtime-build-desc">
<title id="cos-multi-runtime-build-title">One source, every runtime</title>
<desc id="cos-multi-runtime-build-desc">Source files in os/ (64 skills, 9 agents) and CLAUDE.md feed tools/build/build.sh, which runs five builders: build-claude.sh writes .claude/skills and .claude/agents for Claude Code; build-agents-md.sh writes AGENTS.md for Codex, Aider and other AGENTS.md readers; build-gemini.sh writes GEMINI.md for Gemini CLI; build-cursor.sh writes .cursor/rules and .cursorrules for Cursor; build-codex.sh writes .codex/config.md for Codex CLI. build.sh --check validates without writing. .claude/hooks, settings.json and agent-memory are hand-maintained, not generated.</desc>
<style>
