<defs>
<filter id="cos-workflow-paths-sh" x="-5%" y="-5%" width="110%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" class="shadow"/></filter>
<marker id="cos-workflow-paths-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5 Z" class="ah"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="893" rx="16" class="panel"/>
<text x="40" y="52" class="r-title">Where to start</text>
<text x="40" y="78" class="r-sub">Three entry points, from cheapest to most complete. Then the feedback loop keeps you shipping.</text>
<rect x="40" y="120" width="264" height="298" rx="10" class="card" filter="url(#cos-workflow-paths-sh)"/>
<rect x="48" y="132" width="3" height="274" rx="1.5" class="bar f-growth"/>
<g class="f-growth">
<text x="64" y="150" class="r-label">VALIDATE DEMAND</text>
</g>
<text x="64" y="178" class="r-codeh">/gtm-sprint</text>
<text x="64" y="198" class="r-meta">7, 14 or 21 days · no code</text>
<line x1="64" y1="214" x2="284" y2="214" class="rule"/>
<text x="64" y="238" class="r-hs">Start here if</text>
<text x="64" y="258" class="r-body">You are not sure anyone will</text>
<text x="64" y="276" class="r-body">pay.</text>
<text x="64" y="304" class="r-hs">You get</text>
<text x="64" y="324" class="r-body">ICP, interviews, pain matrix,</text>
<text x="64" y="342" class="r-body">LOIs, launch assets.</text>
<line x1="64" y1="378" x2="284" y2="378" class="rule"/>
<text x="64" y="402" class="r-meta">Move on when demand is proven.</text>
<rect x="348" y="120" width="264" height="298" rx="10" class="card" filter="url(#cos-workflow-paths-sh)"/>
<rect x="356" y="132" width="3" height="274" rx="1.5" class="bar f-eng"/>
<g class="f-eng">
<text x="372" y="150" class="r-label">PROVE THE TECH</text>
</g>
<text x="372" y="178" class="r-codeh">/rapid-prototype</text>
<text x="372" y="198" class="r-meta">4 hours, 1 day or 3 days</text>
<line x1="372" y1="214" x2="592" y2="214" class="rule"/>
<text x="372" y="238" class="r-hs">Start here if</text>
<text x="372" y="258" class="r-body">You need a demo or proof of</text>
<text x="372" y="276" class="r-body">concept.</text>
<text x="372" y="304" class="r-hs">You get</text>
<text x="372" y="324" class="r-body">Mini-PRD (3 criteria max),</text>
<text x="372" y="342" class="r-body">working demo. Skips RFC,</text>
<text x="372" y="360" class="r-body">security, QA.</text>
<line x1="372" y1="378" x2="592" y2="378" class="rule"/>
<text x="372" y="402" class="r-meta">Move on when the idea works.</text>
<path d="M308,182 L344,182" class="edge" marker-end="url(#cos-workflow-paths-ah)"/>
<rect x="656" y="120" width="264" height="298" rx="10" class="card" filter="url(#cos-workflow-paths-sh)"/>
<rect x="664" y="132" width="3" height="274" rx="1.5" class="bar f-orch"/>
<g class="f-orch">
<text x="680" y="150" class="r-label">BUILD AND LAUNCH</text>
</g>
<text x="680" y="178" class="r-codeh">/ship</text>
<text x="680" y="198" class="r-meta">full pipeline, every gate</text>
<line x1="680" y1="214" x2="900" y2="214" class="rule"/>
<text x="680" y="238" class="r-hs">Start here if</text>
<text x="680" y="258" class="r-body">You know what to build.</text>
<text x="680" y="286" class="r-hs">You get</text>
<text x="680" y="306" class="r-body">PRD, RFC, code, test plan, QA</text>
<text x="680" y="324" class="r-body">report, launch brief.</text>
<line x1="680" y1="378" x2="900" y2="378" class="rule"/>
<text x="680" y="402" class="r-meta">Done when release passes.</text>
<path d="M616,182 L652,182" class="edge" marker-end="url(#cos-workflow-paths-ah)"/>
<rect x="40" y="442" width="880" height="48" rx="10" class="sunken"/>
<text x="64" y="471" class="r-body">Not sure? Describe the goal. The workflow-router skill picks one of 10 paths, such as bug fix or GTM.</text>
<g class="f-product">
<text x="40" y="530" class="r-label">AFTER LAUNCH: THE INBOUND FEEDBACK LOOP</text>
</g>
<rect x="40" y="550" width="264" height="104" rx="10" class="card" filter="url(#cos-workflow-paths-sh)"/>
<rect x="48" y="562" width="3" height="80" rx="1.5" class="bar f-product"/>
<text x="64" y="580" class="r-codeh">customer-conversations</text>
<text x="64" y="604" class="r-body">Prep calls and log debriefs. 7</text>
<text x="64" y="622" class="r-body">types, including mom-test.</text>
<rect x="348" y="550" width="264" height="104" rx="10" class="card" filter="url(#cos-workflow-paths-sh)"/>
<rect x="356" y="562" width="3" height="80" rx="1.5" class="bar f-product"/>
<text x="372" y="580" class="r-codeh">feedback-synthesizer</text>
<text x="372" y="604" class="r-body">Themes, pain matrix, and a</text>
<text x="372" y="622" class="r-body">score per PRD candidate.</text>
<rect x="656" y="550" width="264" height="104" rx="10" class="card" filter="url(#cos-workflow-paths-sh)"/>
<rect x="664" y="562" width="3" height="80" rx="1.5" class="bar f-product"/>
<text x="680" y="580" class="r-codeh">sprint-prioritizer</text>
<text x="680" y="604" class="r-body">Ranks candidates by impact,</text>
<text x="680" y="622" class="r-body">effort, and risk.</text>
<rect x="656" y="710" width="264" height="104" rx="10" class="card" filter="url(#cos-workflow-paths-sh)"/>
<rect x="664" y="722" width="3" height="80" rx="1.5" class="bar f-product"/>
<text x="680" y="740" class="r-codeh">prd-writer</text>
<text x="680" y="764" class="r-body">Turns the top candidate into a</text>
<text x="680" y="782" class="r-body">PRD.</text>
<rect x="348" y="710" width="264" height="104" rx="10" class="card" filter="url(#cos-workflow-paths-sh)"/>
<rect x="356" y="722" width="3" height="80" rx="1.5" class="bar f-orch"/>
<text x="372" y="740" class="r-codeh">/ship</text>
<text x="372" y="764" class="r-body">Build, verify, and release</text>
<text x="372" y="782" class="r-body">with gates.</text>
<rect x="40" y="710" width="264" height="104" rx="10" class="card" filter="url(#cos-workflow-paths-sh)"/>
<rect x="48" y="722" width="3" height="80" rx="1.5" class="bar f-neutral"/>
<text x="64" y="740" class="r-h">Your users</text>
<text x="64" y="764" class="r-body">Use the shipped product and</text>
<text x="64" y="782" class="r-body">talk to you again.</text>
<path d="M306,602 L346,602" class="edge" marker-end="url(#cos-workflow-paths-ah)"/>
<path d="M614,602 L654,602" class="edge" marker-end="url(#cos-workflow-paths-ah)"/>
<path d="M788,656 L788,708" class="edge" marker-end="url(#cos-workflow-paths-ah)"/>
<path d="M654,762 L614,762" class="edge" marker-end="url(#cos-workflow-paths-ah)"/>
<path d="M346,762 L306,762" class="edge" marker-end="url(#cos-workflow-paths-ah)"/>
<path d="M172,708 L172,656" class="edge" marker-end="url(#cos-workflow-paths-ah)"/>
<path d="M480,654 V668" class="edge dotted"/>
<rect x="213.5" y="668" width="533" height="28" rx="6" class="sunken"/>
<text x="480" y="686" class="r-meta" text-anchor="middle">Score: over 15 → /ship · 8 to 15 → discovery-validation · under 8 → monitor</text>
<text x="40" y="850" class="r-meta">Other signals: churn risk goes to support-operations, ICP shifts to icp-positioning. See standards/ops/inbound-loop-sop.md</text>
<text x="920" y="876" class="r-meta" text-anchor="end">Company OS · generated by docs/diagrams/render.js</text>
</svg>
