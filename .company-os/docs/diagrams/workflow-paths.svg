<svg xmlns="http://www.w3.org/2000/svg" id="cos-workflow-paths" width="960" height="894" viewBox="0 0 960 894" role="img" aria-labelledby="cos-workflow-paths-title cos-workflow-paths-desc">
<title id="cos-workflow-paths-title">Where to start</title>
<desc id="cos-workflow-paths-desc">Entry points: /gtm-sprint validates demand in 7, 14 or 21 days with no code; /rapid-prototype proves the tech in 4 hours, 1 day or 3 days and skips RFC, security review and QA; /ship builds and launches with every gate. Not sure: describe the goal and the workflow-router skill picks one of 10 paths. Feedback loop: customer-conversations, feedback-synthesizer (scores candidates: over 15 go to /ship, 8 to 15 to the discovery-validation skill, under 8 monitor), sprint-prioritizer, prd-writer, /ship, users of the shipped product, back to customer-conversations.</desc>
<style>
#cos-workflow-paths{--bg:#f6f8fa;--surface:#ffffff;--sunken:#f6f8fa;--border:#d1d9e0;--border-soft:#e4e9ee;--text:#1f2328;--text-2:#4b5562;--text-3:#606a76;--line:#8c959f;--shadow:#1f2328;--shadow-o:0.07;--solid:#24292f;--on-solid:#ffffff;--mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
#cos-workflow-paths .f-orch{--a:#4f46e5;--a-soft:#eef0ff}#cos-workflow-paths .f-product{--a:#7c3aed;--a-soft:#f4effe}#cos-workflow-paths .f-eng{--a:#0f766e;--a-soft:#e6f5f3}#cos-workflow-paths .f-qa{--a:#0369a1;--a-soft:#e8f4fb}#cos-workflow-paths .f-growth{--a:#be185d;--a-soft:#fdf0f6}#cos-workflow-paths .f-ops{--a:#b42318;--a-soft:#fdf1f0}#cos-workflow-paths .f-gate{--a:#b45309;--a-soft:#fef6e7}#cos-workflow-paths .f-neutral{--a:#4b5562;--a-soft:#f1f3f5}
