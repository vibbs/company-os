<defs>
<filter id="cos-install-upgrade-sh" x="-5%" y="-5%" width="110%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" class="shadow"/></filter>
<marker id="cos-install-upgrade-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5 Z" class="ah"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="1127" rx="16" class="panel"/>
<text x="40" y="52" class="r-title">Install once, upgrade safely</text>
<text x="40" y="78" class="r-sub">One command installs Company OS. Upgrades merge file by file and never touch your own work.</text>
<g class="f-orch">
<text x="40" y="120" class="r-label">INSTALL (FIRST TIME)</text>
</g>
<rect x="84" y="136" width="524" height="152" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="104" y="164" class="r-hs">Run the installer</text>
<text x="104" y="186" class="r-codes">curl -fsSL \</text>
<text x="104" y="208" class="r-codes">  https://raw.githubusercontent.com/vibbs/company-os/main/install.sh \</text>
<text x="104" y="230" class="r-codes">  | bash -s -- --runtime=claude</text>
<text x="104" y="248" class="r-body">From your project root. Works in a new or an existing repo. Swap</text>
<text x="104" y="266" class="r-body">claude for cursor, codex, gemini, aider, all or core.</text>
<rect x="84" y="302" width="524" height="108" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="104" y="330" class="r-hs">Pick runtimes</text>
<text x="104" y="352" class="r-code">--runtime=claude,cursor</text>
<text x="104" y="370" class="r-body">Combine runtimes with commas. Without the flag, the installer</text>
<text x="104" y="388" class="r-body">auto-detects Claude Code, Cursor, Codex, Gemini CLI and Aider.</text>
<rect x="84" y="424" width="524" height="86" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="104" y="452" class="r-hs">Install files</text>
<text x="104" y="470" class="r-body">os/ and AGENTS.md always. Adds .claude/, .cursor/, GEMINI.md or</text>
<text x="104" y="488" class="r-body">.codex/ for each runtime.</text>
<rect x="84" y="524" width="524" height="86" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="104" y="552" class="r-hs">Keep your work</text>
<text x="104" y="570" class="r-body">Never overwritten: company.config.yaml, artifacts/, tasks/, cogs/,</text>
<text x="104" y="588" class="r-body">.claude/agent-memory/.</text>
<rect x="84" y="624" width="524" height="90" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="104" y="652" class="r-hs">Configure</text>
<text x="104" y="674" class="r-code">/setup</text>
<text x="104" y="692" class="r-body">Fills in company.config.yaml, sets permissions, creates folders.</text>
<rect x="84" y="728" width="524" height="72" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="104" y="756" class="r-hs">Start building</text>
<text x="104" y="778" class="r-code">/ship  ·  /gtm-sprint  ·  /rapid-prototype</text>
<line x1="54" y1="158" x2="54" y2="750" class="rule" style="stroke:var(--border)"/>
<g class="f-orch"><circle cx="54" cy="158" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-orch">
<text x="54" y="162" class="r-badge c-a" text-anchor="middle">1</text>
</g>
<g class="f-orch"><circle cx="54" cy="324" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-orch">
<text x="54" y="328" class="r-badge c-a" text-anchor="middle">2</text>
</g>
<g class="f-orch"><circle cx="54" cy="446" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-orch">
<text x="54" y="450" class="r-badge c-a" text-anchor="middle">3</text>
</g>
<g class="f-orch"><circle cx="54" cy="546" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-orch">
<text x="54" y="550" class="r-badge c-a" text-anchor="middle">4</text>
</g>
<g class="f-orch"><circle cx="54" cy="646" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-orch">
<text x="54" y="650" class="r-badge c-a" text-anchor="middle">5</text>
</g>
<g class="f-orch"><circle cx="54" cy="750" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-orch">
<text x="54" y="754" class="r-badge c-a" text-anchor="middle">6</text>
</g>
<g class="f-eng">
<text x="624" y="120" class="r-label">UPGRADE (LATER)</text>
</g>
<rect x="668" y="136" width="268" height="108" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="688" y="164" class="r-hs">Check</text>
<text x="688" y="186" class="r-code">/upgrade-company-os check</text>
<text x="688" y="204" class="r-body">Or install.sh --check. Shows if</text>
<text x="688" y="222" class="r-body">a newer version exists.</text>
<rect x="668" y="258" width="268" height="144" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="688" y="286" class="r-hs">Preview</text>
<text x="688" y="308" class="r-code">/upgrade-company-os preview</text>
<text x="688" y="326" class="r-body">Downloads the installer to a</text>
<text x="688" y="344" class="r-body">temp folder and runs it with</text>
<text x="688" y="362" class="r-body">--dry-run --force. Writes</text>
<text x="688" y="380" class="r-body">nothing.</text>
<rect x="668" y="416" width="268" height="162" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="688" y="444" class="r-hs">Apply</text>
<text x="688" y="466" class="r-code">/upgrade-company-os apply</text>
<text x="688" y="484" class="r-body">Backs up first to</text>
<text x="688" y="502" class="r-body">.company-os/backup/ on major</text>
<text x="688" y="520" class="r-body">versions, with --backup, or</text>
<text x="688" y="538" class="r-body">with no manifest. Keeps the</text>
<text x="688" y="556" class="r-body">runtimes you already have.</text>
<rect x="668" y="592" width="268" height="198" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="688" y="620" class="r-hs">Smart merge, file by file</text>
<text x="688" y="638" class="r-body">Compares your file with the</text>
<text x="688" y="656" class="r-body">template you last got (hashes</text>
<text x="688" y="674" class="r-body">in .company-os/manifest):</text>
<text x="688" y="699" class="r-body">template changed</text>
<path d="M820,695 L848,695" class="edge" marker-end="url(#cos-install-upgrade-ah)"/>
<rect x="852" y="684" width="64" height="22" rx="11" class="tint f-eng"/>
<g class="f-eng">
<text x="884" y="699.2" class="r-meta c-a" text-anchor="middle">updated</text>
</g>
<text x="688" y="729" class="r-body">only you edited</text>
<path d="M820,725 L848,725" class="edge" marker-end="url(#cos-install-upgrade-ah)"/>
<rect x="852" y="714" width="43" height="22" rx="11" class="tint f-orch"/>
<g class="f-orch">
<text x="873.5" y="729.2" class="r-meta c-a" text-anchor="middle">kept</text>
</g>
<text x="688" y="759" class="r-body">both changed</text>
<path d="M820,755 L848,755" class="edge" marker-end="url(#cos-install-upgrade-ah)"/>
<rect x="852" y="744" width="70" height="22" rx="11" class="tint f-gate"/>
<g class="f-gate">
<text x="887" y="759.2" class="r-meta c-a" text-anchor="middle">conflict</text>
</g>
<rect x="668" y="804" width="268" height="104" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="688" y="832" class="r-hs">Migrate and verify</text>
<text x="688" y="850" class="r-body">Runs .company-os/migrations/,</text>
<text x="688" y="868" class="r-body">stamps the version, then</text>
<text x="688" y="886" class="r-body">health-check.sh.</text>
<rect x="668" y="922" width="268" height="144" rx="10" class="card" filter="url(#cos-install-upgrade-sh)"/>
<text x="688" y="950" class="r-hs">Roll back if needed</text>
<text x="688" y="972" class="r-code">/upgrade-company-os rollback</text>
<text x="688" y="990" class="r-body">Restores os/, .claude/, tools/</text>
<text x="688" y="1008" class="r-body">and CLAUDE.md from a backup,</text>
<text x="688" y="1026" class="r-body">then run build.sh to refresh</text>
<text x="688" y="1044" class="r-body">the other adapters.</text>
<line x1="638" y1="158" x2="638" y2="944" class="rule" style="stroke:var(--border)"/>
<g class="f-eng"><circle cx="638" cy="158" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-eng">
<text x="638" y="162" class="r-badge c-a" text-anchor="middle">1</text>
</g>
<g class="f-eng"><circle cx="638" cy="280" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-eng">
<text x="638" y="284" class="r-badge c-a" text-anchor="middle">2</text>
</g>
<g class="f-eng"><circle cx="638" cy="438" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-eng">
<text x="638" y="442" class="r-badge c-a" text-anchor="middle">3</text>
</g>
<g class="f-eng"><circle cx="638" cy="614" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-eng">
<text x="638" y="618" class="r-badge c-a" text-anchor="middle">4</text>
</g>
<g class="f-eng"><circle cx="638" cy="826" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-eng">
<text x="638" y="830" class="r-badge c-a" text-anchor="middle">5</text>
</g>
<g class="f-eng"><circle cx="638" cy="944" r="12" class="tint" stroke-width="1.25"/></g>
<g class="f-eng">
<text x="638" y="948" class="r-badge c-a" text-anchor="middle">6</text>
</g>
<text x="920" y="1110" class="r-meta" text-anchor="end">Company OS · generated by docs/diagrams/render.js</text>
</svg>
