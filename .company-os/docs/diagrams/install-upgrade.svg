<svg xmlns="http://www.w3.org/2000/svg" id="cos-install-upgrade" width="960" height="1128" viewBox="0 0 960 1128" role="img" aria-labelledby="cos-install-upgrade-title cos-install-upgrade-desc">
<title id="cos-install-upgrade-title">Install once, upgrade safely</title>
<desc id="cos-install-upgrade-desc">Install: run the installer with curl; it auto-detects Claude Code, Cursor, Codex, Gemini CLI and Aider or takes --runtime; installs os/ and AGENTS.md always plus one adapter per runtime; never overwrites company.config.yaml, artifacts, tasks, cogs or agent memory; then run /setup and start with /ship, /gtm-sprint or /rapid-prototype. Upgrade: /upgrade-company-os check, preview (dry run), apply (backs up first on major versions, with --backup, or when the install has no manifest), three-way merge using manifest hashes of the template you last received (template changed only: updated; you edited, template unchanged: kept; both changed: conflict copies saved with a timestamp if one already exists), your existing runtime adapters kept, installs from 1.11 or earlier preview only until --force saves .user copies, migrations and health check, rollback from a backup.</desc>
<style>
#cos-install-upgrade{--bg:#f6f8fa;--surface:#ffffff;--sunken:#f6f8fa;--border:#d1d9e0;--border-soft:#e4e9ee;--text:#1f2328;--text-2:#4b5562;--text-3:#606a76;--line:#8c959f;--shadow:#1f2328;--shadow-o:0.07;--solid:#24292f;--on-solid:#ffffff;--mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
#cos-install-upgrade .f-orch{--a:#4f46e5;--a-soft:#eef0ff}#cos-install-upgrade .f-product{--a:#7c3aed;--a-soft:#f4effe}#cos-install-upgrade .f-eng{--a:#0f766e;--a-soft:#e6f5f3}#cos-install-upgrade .f-qa{--a:#0369a1;--a-soft:#e8f4fb}#cos-install-upgrade .f-growth{--a:#be185d;--a-soft:#fdf0f6}#cos-install-upgrade .f-ops{--a:#b42318;--a-soft:#fdf1f0}#cos-install-upgrade .f-gate{--a:#b45309;--a-soft:#fef6e7}#cos-install-upgrade .f-neutral{--a:#4b5562;--a-soft:#f1f3f5}
@media (prefers-color-scheme: dark){#cos-install-upgrade{--bg:#0d1117;--surface:#151b23;--sunken:#10151c;--border:#3d444d;--border-soft:#2a3038;--text:#e6edf3;--text-2:#b1bac4;--text-3:#9198a1;--line:#7d8590;--shadow:#000000;--shadow-o:0.35;--solid:#e6edf3;--on-solid:#0d1117}#cos-install-upgrade .f-orch{--a:#a5b4fc;--a-soft:rgba(129,140,248,0.16)}#cos-install-upgrade .f-product{--a:#c4b5fd;--a-soft:rgba(167,139,250,0.16)}#cos-install-upgrade .f-eng{--a:#5eead4;--a-soft:rgba(45,212,191,0.14)}#cos-install-upgrade .f-qa{--a:#7dd3fc;--a-soft:rgba(56,189,248,0.14)}#cos-install-upgrade .f-growth{--a:#f9a8d4;--a-soft:rgba(244,114,182,0.14)}#cos-install-upgrade .f-ops{--a:#fca5a5;--a-soft:rgba(248,113,113,0.14)}#cos-install-upgrade .f-gate{--a:#fbbf24;--a-soft:rgba(251,191,36,0.14)}#cos-install-upgrade .f-neutral{--a:#b1bac4;--a-soft:rgba(177,186,196,0.12)}}
#cos-install-upgrade text{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:var(--text)}
#cos-install-upgrade .r-title{font-size:22px;font-weight:600}#cos-install-upgrade .r-sub{font-size:14px;font-weight:400}#cos-install-upgrade .r-h{font-size:14px;font-weight:600}#cos-install-upgrade .r-hs{font-size:13px;font-weight:600}#cos-install-upgrade .r-body{font-size:13px;font-weight:400}#cos-install-upgrade .r-meta{font-size:12px;font-weight:400}#cos-install-upgrade .r-badge{font-size:12px;font-weight:500}#cos-install-upgrade .r-label{font-size:12px;font-weight:600;letter-spacing:0.04em}#cos-install-upgrade .r-code{font-size:12px;font-weight:400;font-family:var(--mono)}#cos-install-upgrade .r-codes{font-size:11px;font-weight:400;font-family:var(--mono)}#cos-install-upgrade .r-codeh{font-size:13px;font-weight:600;font-family:var(--mono)}
#cos-install-upgrade .r-sub,#cos-install-upgrade .r-body{fill:var(--text-2)}
#cos-install-upgrade .r-meta{fill:var(--text-3)}
#cos-install-upgrade .r-label,#cos-install-upgrade .c-a{fill:var(--a)}
#cos-install-upgrade .c-2{fill:var(--text-2)}#cos-install-upgrade .c-3{fill:var(--text-3)}#cos-install-upgrade .c-on{fill:var(--on-solid)}
#cos-install-upgrade .panel{fill:var(--bg);stroke:var(--border)}
